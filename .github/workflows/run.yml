name: BTC 4H Monitor

on:
  schedule:
    - cron: '0 */4 * * *' # 4時間ごとに自動実行
  workflow_dispatch: # 手動実行ボタン用

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          pip install pandas pandas_ta ccxt requests
      - name: Run script
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python main.py
