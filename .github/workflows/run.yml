name: Multi-Asset Strategy Monitor

on:
  schedule:
    # UTC 0, 4, 8, 12, 16, 20時 ＝ JST 9, 13, 17, 21, 1, 5時
    - cron: '5 0,4,8,12,16,20 * * *'
  # メインブランチへのPush時にも動作確認したい場合はコメントアウトを解除
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas yfinance requests ccxt
          
      - name: Run script
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python main.py
