name: Multi-Asset Strategy Monitor

on:
  schedule:
    # JST: 7:05, 9:05, 11:05, 13:05, 15:05, 17:05, 19:05, 21:05, 23:05 に実行
    # UTC: 22:05, 0:05, 2:05, 4:05, 6:05, 8:05, 10:05, 12:05, 14:05
    - cron: '5 22,0,2,4,6,8,10,12,14 * * *'
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas yfinance requests ccxt
          
      - name: Run script
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python main.py
